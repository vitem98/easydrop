name = "easydrop"
compatibility_date = "2025-04-01"
pages_build_output_dir = "./public"

# Existing KV namespace titled STORE.
[[kv_namespaces]]
binding = "STORE"
id = "8962b456717b4fcba694e117f91aa18c"

# EasyDrop only writes file:{code}:{index} objects in this bucket.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "easydrop"

# Read-only. Used to report real account usage. Never written or deleted.
[[r2_buckets]]
binding = "R2_AK_AR_GROUPS"
bucket_name = "ak-ar-groups"

[[r2_buckets]]
binding = "R2_AK_AR_SUBMISSIONS"
bucket_name = "ak-ar-submissions"

[vars]
# The per-upload size limit is set on the admin page (default 400 MB) and
# stored in KV under "settings". Objects <= 25 MB stay in KV.
ADMIN_PASSWORD = "XIEjiefeng0615"
