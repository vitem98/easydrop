name = "easydrop"
compatibility_date = "2025-04-01"
pages_build_output_dir = "./public"

# Existing KV namespace titled STORE.
[[kv_namespaces]]
binding = "STORE"
id = "8962b456717b4fcba694e117f91aa18c"

# Files larger than 25 MB are stored here.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "easydrop"

[vars]
# Hard ceiling for one request. Objects <= 25 MB stay in KV.
MAX_FILE_SIZE = "104857600"
ADMIN_PASSWORD = "XIEjiefeng0615"
